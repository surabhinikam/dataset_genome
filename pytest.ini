[pytest]
# ---------------------------------------------------------------------------
# pytest.ini — root-level pytest configuration for dataset_genome
#
# Root cause of regression:
#   backend/__init__.py caused pytest to treat backend/ as a package, making
#   it resolve imports relative to the repo root instead of backend/.
#   The fix: tell pytest explicitly that backend/ is on PYTHONPATH, so
#   `from main import app`, `from services...`, `from app...` all resolve.
#
# pythonpath (pytest >= 7.0): automatically prepends backend/ to sys.path
#   before test collection, without requiring any environment variable.
# ---------------------------------------------------------------------------

testpaths = backend/tests
pythonpath = backend

# Show short tracebacks and verbose test names
addopts = -v --tb=short
